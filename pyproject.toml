[project]
name = "hybrid-kg-rag"
version = "0.1.0"
description = "Hybrid Knowledge Graph + RAG System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
